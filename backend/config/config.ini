[pipeline]
# 公司搜索任务上限
max_company_searches = 4
# 进入人员规划的公司数
max_companies = 8
# 每家公司主查询与备用查询总数
max_person_searches_per_company = 2
# 进入核验阶段的人数
max_leads_to_enrich = 10
# 每个人新增补搜次数
max_enrichment_searches = 2
# 每个run允许的搜索provider调用尝试总数，包含重试
max_search_calls = 40
# 同时进行的搜索与模型调用数
search_concurrency = 4
llm_concurrency = 4
# 单次调用超时
timeout_seconds = 60
# 包含首次调用的最大尝试次数
search_attempts = 2
llm_attempts = 2
# 成功搜索缓存有效期
cache_ttl_seconds = 900
cache_max_entries = 256
max_evidence_results = 10